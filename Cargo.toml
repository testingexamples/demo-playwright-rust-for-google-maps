[package]
name = "demo-playwright-rust-for-google-maps"
version = "1.0.0"
edition = "2021"
description = "Demo Playwright Rust for Google Maps"
license = "MIT OR Apache-2.0 OR GPL-2.0-only OR GPL-3.0-only OR BSD-3-Clause"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
repository = "https://github.com/testingexamples/demo-playwright-rust-for-google-maps/"
publish = false

# CAUTION: this manifest declares playwright-rs as a normal dependency so
# the source below reads as ordinary, buildable Rust — but per README.md
# and AGENTS.md, this crate must NOT actually be compiled or run against
# the live google.com. `cargo build`/`cargo test` are intentionally never
# invoked in this repo's own history; see AGENTS.md for why.
[lib]
name = "demo"
path = "src/demo.rs"

[dependencies]
playwright-rs = "0.17"
tokio = { version = "1", features = ["full"] }
anyhow = "1"

[dev-dependencies]
regex = "1"
